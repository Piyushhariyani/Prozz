name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r auto_code_review/requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: auto_code_review
        run: python -m unittest discover -s tests -p "test_*.py"
